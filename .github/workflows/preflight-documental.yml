# Bootstrap documental de WHEREIS; no es CI Android ni sustituye QA.
name: Preflight documental
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  docs-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout del HEAD exacto de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight offline, sin secretos ni servicios externos
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base origin/main HEAD)"
          git diff --check "$BASE...HEAD"
          if git cat-file -e "$BASE:scripts/check-documentation.py" 2>/dev/null; then
            test -f scripts/check-documentation.py || { echo "FAIL: preflight script removed"; exit 1; }
            git show "$BASE:scripts/check-documentation.py" > "$RUNNER_TEMP/check-documentation.py"
            python3 "$RUNNER_TEMP/check-documentation.py" "$BASE"
          elif test -f scripts/check-documentation.py; then
            # Solo durante bootstrap: el script aún no está integrado en main.
            python3 scripts/check-documentation.py "$BASE"
          else
            echo "PASS: bootstrap whitespace; script documental aún no integrado en main"
          fi
