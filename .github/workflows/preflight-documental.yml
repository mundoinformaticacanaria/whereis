# Bootstrap documental de WHEREIS; no es CI Android ni sustituye QA.
name: Preflight documental
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  docs-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout del HEAD exacto de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight offline, sin secretos ni servicios externos
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base origin/main HEAD)"
          git diff --check "$BASE...HEAD"
          # El validador solo procede del tip confiable de main, nunca de la PR.
          # Así una rama antigua no puede eludirlo con un merge-base previo.
          if git cat-file -e "origin/main:scripts/check-documentation.py" 2>/dev/null; then
            if git diff --name-only --diff-filter=D "$BASE...HEAD" -- scripts/check-documentation.py | grep -q .; then
              echo "FAIL: trusted preflight script deleted by PR"
              exit 1
            fi
            git show "origin/main:scripts/check-documentation.py" > "$RUNNER_TEMP/check-documentation.py"
            python3 "$RUNNER_TEMP/check-documentation.py" "$BASE"
          else
            # Bootstrap estricto: solo se admite la PR que añade este workflow.
            # Nunca ejecutar un script aportado por HEAD como validador confiable.
            CHANGED="$(git diff --name-only "$BASE...HEAD")"
            if [ "$CHANGED" != ".github/workflows/preflight-documental.yml" ]; then
              echo "FAIL: trusted scanner absent from main; bootstrap restricted to workflow-only changes"
              exit 1
            fi
            echo "PASS: workflow-only bootstrap whitespace; trusted scanner not yet in main"
          fi
