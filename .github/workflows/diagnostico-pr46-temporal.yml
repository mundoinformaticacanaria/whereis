# Temporal: evidencia de checkout real de PR #46; se retirará antes de QA final de PR #71.
name: Diagnostico temporal PR46
on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  checkout-pr46:
    if: github.event.pull_request.number == 71
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout autentico PR46
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/46/head
          fetch-depth: 0
          persist-credentials: false

      - name: Comprobar SHA y ejecutar preflight
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=de1b816e0deaeefb10c6f7cbee8c1aba87bf8e60
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED" || { echo "FAIL: HEAD inesperado"; exit 1; }
          BASE="$(git merge-base origin/main HEAD)"
          echo "PR46 HEAD=$ACTUAL"
          echo "BASE=$BASE"
          python3 scripts/check-documentation.py "$BASE"
